<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9">
<title>Assinatura CSSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #e0e0e0;
    font-family: 'Inter', sans-serif;
    margin: 0;
  }
  #btn-download {
    margin-top: 40px;
    padding: 14px 28px;
    background-color: #274070;
    color: #FFFFFF;
    border: 2px solid #C8A75A;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.2s, color 0.2s;
  }
  #btn-download:hover {
    background-color: #15173B;
    color: #C8A75A;
  }
  #form-dados {
    background: #FFFFFF;
    padding: 26px 24px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(21, 23, 59, 0.2);
    margin-bottom: 25px;
    width: 550px;
    display: grid;
    gap: 10px;
  }
  #form-dados input {
    padding: 12px;
    border: 1px solid #274070;
    border-radius: 4px;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #form-dados input:focus {
    border-color: #C8A75A;
    box-shadow: 0 0 5px rgba(247, 208, 89, 0.4);
  }
</style>
</head>
<body>

<div id="form-dados">
  <input type="text" id="in-nome" placeholder="Nome do Colaborador">
  <input type="text" id="in-cargo" placeholder="Cargo Ocupado | Setor">
  <input type="text" id="in-produto" placeholder="Produto Atendido" value="Cartão Saúde Santa Casa">
  <input type="text" id="in-telefone" placeholder="Telefone Principal (só números)">
  <input type="text" id="in-telefone2" placeholder="Telefone Comercial (só números)" value="3832297960">
  <input type="text" id="in-email" placeholder="e-mail@empresa.com.br">
  <input type="text" id="in-endereco" placeholder="Endereço" value="Sede Montes Claros - MG">
</div>

<table id="assinatura" cellpadding="0" cellspacing="0" border="0" style="width: 550px; background-color: #15173B; background-image: linear-gradient(135deg,#172445 0%,#233A67 100%); color: #FFFFFF; font-family:'Inter',sans-serif; padding: 20px; border-radius: 8px;">
  <tr>
    <!-- Coluna Esquerda: Logos (inalterada) -->
    <td style="width:38%; vertical-align: middle; text-align: center; padding-right:24px; border-right: 1px solid rgba(200,167,90,.45);">
      <img src="logos/logo_cs.png" alt="Logo Principal" style="width: 95%; height: auto; display: block; margin: 0px auto;">
      <img src="logos/logo_sc_vs.png" alt="Logos Secundárias" style="width: 106%; padding-top: 20px; height: auto; display: block; margin: 0 auto;">
    </td>

    <!-- Coluna Direita: Informações (REVISADA) -->
    <td style="padding-left: 20px; vertical-align: middle; line-height: 1.6; font-size: 14px;">
      
      <div id="sig-nome" style="font-size: 19px; font-weight: 700; letter-spacing:.2px; color:#D2B46C; margin-bottom: 6px;">Nome do Colaborador</div>
      <div style="width:60%; height:2px; background:#C8A75A; margin:6px 0 10px; border-radius:2px;"></div>
      <div id="sig-cargo" style="color: #E4E8EE; font-size: 13px; font-weight: 500; margin-bottom: 4px;">Cargo Ocupado | Setor</div>
      <div id="sig-produto" style="color: #C9D2E3; font-size: 13px; font-weight: bold; margin-bottom: 12px;">Cartão Saúde Santa Casa</div>

      <!-- Telefone -->
      <div style="display: flex; align-items: baseline; margin-bottom: 4px; color: #F2F5F7; font-size:13px; font-weight:400;">
        <span style="display: inline-block; width: 24px; text-align: center; margin-right: 8px;"><i class="fa-solid fa-phone"></i></span>
        <span id="sig-telefone">(00) 00000-0000</span>
        <span style="margin: 0 6px;">|</span>
        <span id="sig-telefone2">(00) 00000-0000</span>
      </div>

      <!-- E-mail (parte local) -->
      <div style="display: flex; align-items: baseline; margin-bottom: 4px; color: #F2F5F7; font-size:13px; font-weight:400;">
        <span style="display: inline-block; width: 24px; text-align: center; margin-right: 8px;"><i class="fa-solid fa-envelope"></i></span>
        <span id="sig-email">e-mail</span>
      </div>

      <!-- Domínio (com @) -->
      <div style="display: flex; align-items: baseline; margin-bottom: 4px; color: #F2F5F7; font-size:13px; font-weight:400;">
        <span style="display: inline-block; width: 24px; text-align: center; margin-right: 8px;"><i class="fa-solid fa-at"></i></span>
        <span id="sig-domain">@empresa.com.br</span>
      </div>

      <!-- Endereço -->
      <div style="display: flex; align-items: baseline; margin-bottom: 4px; color: #F2F5F7; font-size:13px; font-weight:400;">
        <span style="display: inline-block; width: 24px; text-align: center; margin-right: 8px;"><i class="fa-solid fa-location-dot"></i></span>
        <span id="sig-endereco">Sede Montes Claros - MG</span>
      </div>

    </td>
  </tr>
</table>

<button id="btn-download">Baixar Assinatura (.PNG)</button>

<script>
  const campos = ['nome', 'cargo', 'produto', 'telefone', 'telefone2', 'email', 'endereco'];
  const sigDomain = document.getElementById('sig-domain');

  campos.forEach(c => {
    const input = document.getElementById(`in-${c}`);
    const sig = document.getElementById(`sig-${c}`);
    const textoPadrao = sig ? sig.innerText : '';
    if (!input) return;

    const atualizarMascara = () => {
      let val = input.value;

      if (c.startsWith('telefone')) {
        val = val.replace(/\D/g, '').substring(0, 11);
        val = val.replace(/^(\d{2})(\d)/g, '($1) $2').replace(/(\d{4,5})(\d{4})$/, '$1-$2');
        input.value = val;
        sig.innerText = val ? `${val}` : textoPadrao;
      } else if (c === 'email') {
        const partes = val.split('@');
        sig.innerText = partes[0] || 'e-mail';
        sigDomain.innerText = partes.length > 1 ? '@' + partes.slice(1).join('@') : (val ? '' : '@empresa.com.br');
      } else {
        sig.innerText = val || textoPadrao;
      }
    };

    input.addEventListener('input', atualizarMascara);
    if (input.value) atualizarMascara();
  });

  document.getElementById("btn-download").onclick = () => {
    html2canvas(document.getElementById("assinatura"), {
      scale: 2,
      backgroundColor: null,
      useCORS: true
    }).then(canvas => {
      const a = document.createElement("a");
      a.download = "assinatura_email.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });
  };
</script>
</body>
</html>
